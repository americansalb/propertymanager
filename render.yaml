services:
  - type: web
    name: propertymanager-1-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: propertymanager-1-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: propertymanager-1-redis
          property: connectionString
      - key: FRONTEND_ADMIN_URL
        value: 'https://propertymanager-1.onrender.com'
      - key: FRONTEND_TENANT_URL
        value: 'https://propertymanager-1-tenant.onrender.com'
      - key: ALLOWED_ORIGINS
        value: 'https://propertymanager-1.onrender.com,https://propertymanager-1-tenant.onrender.com'
      - key: COOKIE_DOMAIN
        value: '.onrender.com'

  - type: web
    name: propertymanager-1
    runtime: docker
    dockerfilePath: ./Dockerfile.admin
    plan: starter
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: propertymanager-1-tenant
    runtime: docker
    dockerfilePath: ./Dockerfile.tenant
    plan: starter
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: 'https://propertymanager-1-api.onrender.com'

  - type: redis
    name: propertymanager-1-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: propertymanager-1-db
    databaseName: propertymanager
    user: propertymanager
    plan: starter
    postgresMajorVersion: 15
