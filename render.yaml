services:
  # Single service that serves API + Admin Frontend + Tenant Frontend
  - type: web
    name: propertymanager-1
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: propertymanager-1-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: propertymanager-1-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: 'https://propertymanager-1.onrender.com'
      - key: COOKIE_DOMAIN
        value: '.onrender.com'
      # Amazon SES Email Configuration
      - key: SMTP_HOST
        value: 'email-smtp.us-east-1.amazonaws.com'
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: 'PropertyMaster'
      # Helcim Payment Configuration
      - key: HELCIM_API_TOKEN
        sync: false
      - key: HELCIM_ACCOUNT_ID
        sync: false
      - key: HELCIM_WEBHOOK_SECRET
        sync: false

  - type: redis
    name: propertymanager-1-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: propertymanager-1-db
    databaseName: propertymaster
    user: propertymaster
    plan: starter
    postgresMajorVersion: 15
