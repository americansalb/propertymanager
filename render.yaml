services:
  - type: web
    name: propertymaster-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: propertymaster-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: propertymaster-redis
          property: connectionString

  - type: redis
    name: propertymaster-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: propertymaster-db
    databaseName: propertymaster
    user: propertymaster
    plan: starter
    postgresMajorVersion: 15
