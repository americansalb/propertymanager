services:
  - type: web
    name: propertymaster-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: propertymaster-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: propertymaster-redis
          property: connectionString
      - key: FRONTEND_ADMIN_URL
        value: 'https://propertymaster-admin.onrender.com'
      - key: FRONTEND_TENANT_URL
        value: 'https://propertymaster-tenant-portal.onrender.com'
      - key: ALLOWED_ORIGINS
        value: 'https://propertymaster-admin.onrender.com,https://propertymaster-tenant-portal.onrender.com'
      - key: COOKIE_DOMAIN
        value: '.onrender.com'

  - type: web
    name: propertymaster-admin
    runtime: docker
    dockerfilePath: ./Dockerfile.admin
    plan: starter
    autoDeploy: true
    dockerCommand: ''
    buildCommand: ''
    envVars:
      - key: NODE_ENV
        value: production
      # VITE_API_URL is a build arg, set in Dockerfile.admin
      # The actual API URL is baked in at build time

  - type: web
    name: propertymaster-tenant-portal
    runtime: docker
    dockerfilePath: ./Dockerfile.tenant
    plan: starter
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: 'https://propertymaster-api.onrender.com'

  - type: redis
    name: propertymaster-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: propertymaster-db
    databaseName: propertymaster
    user: propertymaster
    plan: starter
    postgresMajorVersion: 15
