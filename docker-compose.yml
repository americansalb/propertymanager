# Local development infrastructure only (the app runs via `pnpm dev`).
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: villagekeep
      POSTGRES_PASSWORD: villagekeep
      POSTGRES_DB: villagekeep
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025' # web UI
      - '1025:1025' # SMTP

volumes:
  pgdata:
