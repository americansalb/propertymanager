version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: propertymaster-db
    environment:
      POSTGRES_USER: propertymaster
      POSTGRES_PASSWORD: dev_password_change_in_production
      POSTGRES_DB: propertymaster_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U propertymaster']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: propertymaster-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Mailhog for local email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: propertymaster-mail
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    logging:
      driver: none

volumes:
  postgres_data:
  redis_data:
